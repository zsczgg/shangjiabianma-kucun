name: shangjiabianma-kucun

services:
  app:
    build:
      context: .
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-bookworm}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "3220:3220"
    volumes:
      - ./data:/inventory-app/data
    networks:
      - default
      - catalog-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3220').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    depends_on:
      app:
        condition: service_healthy
  backup:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    command: sh -c 'while true; do cp /data/inventory.db /backups/inventory-$$(date +%Y%m%d-%H%M%S).db 2>/dev/null || true; find /backups -type f -mtime +30 -delete; sleep 21600; done'

networks:
  catalog-internal:
    name: shangjiabianma-internal
    external: true
